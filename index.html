<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gire e Ganha - Bônus Exclusivo Brasil</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Arial Black', sans-serif;
            background: #1a1a1a url('background.png') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        /* --- ANIMAZIONE MONETE --- */
        #coins-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .coin-particle {
            position: absolute;
            background: url('https://img.icons8.com/emoji/48/000000/coin-emoji.png') no-repeat center;
            background-size: contain;
            opacity: 0.6;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* --- PERSONAGENS E AMBIENTE --- */
        .char-left, .char-right {
            position: absolute;
            bottom: 0;
            width: 25%; height: 75%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom;
            z-index: 1;
            pointer-events: none;
            animation: floating 4s ease-in-out infinite;
            display: none;
        }
        @media (min-width: 1024px) { .char-left, .char-right { display: block; } }

        .char-left { left: 0; background-image: url('personaggio-sinistra.png'); }
        .char-right { right: 0; background-image: url('personaggio-destra.png'); }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* --- CONTAINER PRINCIPALE --- */
        .main-container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 95%;
            max-width: 500px;
        }

        h1 {
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
            font-size: clamp(1.5rem, 6vw, 2.5rem);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        /* --- WHEEL CON PULSE --- */
        .wheel-wrapper {
            position: relative;
            width: min(85vw, 450px);
            aspect-ratio: 1 / 1; 
            margin: 20px auto;
            /* APPLICHIAMO IL PULSE AL WRAPPER */
            animation: wheelPulse 3s ease-in-out infinite;
        }

        @keyframes wheelPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.8)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4)); }
        }

        .pointer {
            position: absolute;
            top: -5%; left: 50%;
            transform: translateX(-50%);
            width: 15%; height: 15%;
            background: url('pointer.png') no-repeat center center;
            background-size: contain;
            z-index: 20;
        }

        .wheel-disk {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: url('wheel-disk.png') no-repeat center center;
            background-size: contain;
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .spin-trigger {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 25%; height: 25%;
            cursor: pointer;
            z-index: 25;
            background: url('spin-button.png') no-repeat center center;
            background-size: contain;
            border: none;
            filter: drop-shadow(0 0 10px gold);
            animation: btnPulse 1.5s infinite;
        }

        @keyframes btnPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.15); }
        }

        /* --- RESULT OVERLAY --- */
        #result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .cta-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            color: #333;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 4px solid gold;
        }

        .affiliate-link {
            display: block;
            margin-top: 20px;
            background: #27ae60;
            color: white;
            text-decoration: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: bold;
            box-shadow: 0 5px 0 #1e8449;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="char-left"></div>
    <div class="char-right"></div>

    <div class="main-container">
        <h1>BÔNUS DE <span style="color: gold;">100%</span></h1>
        <p style="text-transform: uppercase; letter-spacing: 1px;">Gire a roleta e ganhe!</p>
        
        <div id="wheel-container" class="wheel-wrapper">
            <div class="pointer"></div>
            <div id="wheel" class="wheel-disk"></div>
            <button class="spin-trigger" id="spinBtn" onclick="jogarRoleta()"></button>
        </div>
    </div>

    <div id="result-overlay">
        <div class="cta-box">
            <h2 style="color: #d35400;">PARABÉNS! 🎉</h2>
            <p style="margin: 15px 0;">Você ganhou <b>Bônus de 100% + 500 Giros Grátis!</b></p>
            <a href="https://SEU-LINK-AFILIADO.com" class="affiliate-link">RESGATAR AGORA</a>
            <p style="font-size: 0.8rem; margin-top: 15px; color: #666;">
                Oferta expira em: <span id="timer">05:00</span>
            </p>
        </div>
    </div>

    <script>
        // --- ANIMAZIONE MONETE ---
        function createCoins() {
            const container = document.createElement('div');
            container.id = 'coins-container';
            document.body.appendChild(container);
            const isMobile = window.innerWidth < 768;
            const coinCount = isMobile ? 15 : 35;

            for (let i = 0; i < coinCount; i++) {
                const coin = document.createElement('div');
                coin.className = 'coin-particle';
                const left = Math.random() * 100;
                const duration = 4 + Math.random() * 6;
                const delay = Math.random() * 5;
                const size = 15 + Math.random() * 20;
                coin.style.left = left + '%';
                coin.style.animationDuration = duration + 's';
                coin.style.animationDelay = delay + 's';
                coin.style.width = size + 'px';
                coin.style.height = size + 'px';
                container.appendChild(coin);
            }
        }

        // --- LOGICA RUOTA ---
        let girando = false;
        function jogarRoleta() {
            if (girando) return;
            girando = true;
            
            const wheel = document.getElementById('wheel');
            const wrapper = document.getElementById('wheel-container');
            const btn = document.getElementById('spinBtn');

            // Fermiamo il pulse durante il giro per fluidità
            wrapper.style.animation = 'none';
            btn.style.display = 'none';

            const anguloVitoria = 2880 + 144; 
            wheel.style.transform = `rotate(${anguloVitoria}deg)`;

            setTimeout(() => {
                document.getElementById('result-overlay').style.display = 'flex';
                iniciarTimer();
            }, 5200);
        }

        function iniciarTimer() {
            let tempo = 300;
            const display = document.getElementById('timer');
            setInterval(() => {
                let min = Math.floor(tempo / 60);
                let sec = tempo % 60;
                display.innerText = `0${min}:${sec < 10 ? '0'+sec : sec}`;
                if (tempo > 0) tempo--;
            }, 1000);
        }

        window.onload = createCoins;
    </script>
</body>
</html>
